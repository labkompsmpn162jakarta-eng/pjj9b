<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Laporan PJJ Kelas 9B</title>
    <style>
        :root {
            --bg-color: #fceade;
            --clay-bg: #fff5ee;
            --clay-border: #f0d4c9;
            --shadow-light: #ffffff;
            --shadow-dark: #d8b4a6;
            --text-color: #5c4033;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-color);
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2rem;
            text-align: center;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px var(--shadow-light);
        }

        /* Container Kolase dengan Efek 3D Clay Besar */
        .clay-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
            max-width: 1300px;
            background: var(--clay-bg);
            padding: 30px;
            border-radius: 35px;
            box-shadow: 
                15px 15px 35px var(--shadow-dark), 
                -15px -15px 35px var(--shadow-light),
                inset 5px 5px 10px rgba(255, 255, 255, 0.6),
                inset -5px -5px 10px rgba(0, 0, 0, 0.05);
            border: 4px solid var(--clay-border);
        }

        /* Kotak Item Foto ala Clay */
        .clay-card {
            aspect-ratio: 1 / 1;
            background-color: #f7e1d7;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            border: 3px solid #ffffff;
            /* Efek Clay 3D menonjol keluar */
            box-shadow: 
                6px 6px 12px var(--shadow-dark), 
                -6px -6px 12px var(--shadow-light);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Efek Interaktif Saat Disentuh/Hover */
        .clay-card:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 
                10px 10px 20px var(--shadow-dark), 
                -10px -10px 20px var(--shadow-light);
            z-index: 10;
        }

        /* Gambar di dalam Kartu */
        .clay-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            transition: transform 0.3s ease;
        }

        .clay-card:hover img {
            transform: scale(1.1);
        }

        /* Label Nomor / Placeholder Text jika belum ada foto */
        .clay-card span {
            position: absolute;
            font-weight: bold;
            font-size: 1.1rem;
            color: #b0897a;
            text-shadow: 1px 1px 0px var(--shadow-light);
            pointer-events: none;
        }

        /* Responsif untuk Layar Tablet & Mobile */
        @media (max-width: 1024px) {
            .clay-container {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 600px) {
            .clay-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
                padding: 15px;
            }
        }
    </style>
</head>
